name: Leaves Test CI

on:
  push:
    branches-ignore: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Get JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "zulu"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never
          cache-read-only: false
      - name: Setup Git Config
        run: |
          git config --global user.email "ci-test@leavesmc.org"
          git config --global user.name "LeavesMC Test CI"
          git config --global core.excludesfile "$HOME/.gitignore_global"
          printf '.DS_Store\n._*\n' > "$HOME/.gitignore_global"
      # Dev-only step: while leavesweight 2.2.0 is in PR, pull from HyacinthHaru's fork
      # and publish to mavenLocal. Removed on master (PR target) — see PATCH_REBASE_PLAYBOOK §十一.
      - name: Check out leavesweight fork
        if: github.repository == 'HyacinthHaru/Leaves'
        uses: actions/checkout@v4
        with:
          repository: HyacinthHaru/leavesweight
          ref: feat/paper-26.1-support
          path: leavesweight-src
      - name: Publish leavesweight to mavenLocal
        if: github.repository == 'HyacinthHaru/Leaves'
        working-directory: leavesweight-src
        run: ./gradlew publishToMavenLocal
      - name: Apply Patches
        run: ./gradlew applyAllPatches
      - name: Create Leavesclip Jar
        # Leaves - Paper 26.1: task renamed from createMojmapLeavesclipJar
        # (server is now fully Mojang-mapped, so "Mojmap" qualifier is implicit)
        run: ./gradlew createLeavesclipJar
      - name: Move Jar
        run: |
          prop() {
            awk -F= -v key="$1" '$1 == key { val = $2; sub(/[[:space:]]*#.*$/, "", val); gsub(/^[[:space:]]+|[[:space:]]+$/, "", val); print val }' gradle.properties
          }

          jarName="leaves-$(prop mcVersion).jar"
          # Leaves - Paper 26.1: jar filename no longer has -mojmap suffix
          mv leaves-server/build/libs/leaves-leavesclip-"$(prop version)".jar "$jarName"
          echo "jar=$jarName" >> "$GITHUB_ENV"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.jar }}
          path: ${{ env.jar }}
